name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -timeout=60s ./...
      - name: Race detector
        run: go test -race -timeout=60s ./...
      - name: Vet
        run: go vet ./...
      - name: Run combat example
        run: go run ./examples/combat
      - name: Run economy example
        run: go run ./examples/economy
      - name: Run concurrent worlds example
        run: go run -race ./examples/worlds
